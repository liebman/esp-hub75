[package]
name = "esp-hub75"
description = "A Rust driver for HUB75 LED matrix displays on ESP32 microcontrollers"
repository = "https://github.com/liebman/esp-hub75"
documentation = "https://docs.rs/esp-hub75"
keywords = ["esp32", "led-matrix", "hub75", "embedded", "driver"]
categories = ["embedded", "hardware-support", "no-std"]
edition = "2024"
version = "0.16.0"
authors = ["liebman <liebman@zod.com>"]
license = "MIT OR Apache-2.0"
rust-version = "1.95"

[profile.dev]
debug = true    # Symbols are nice and they don't increase the size on Flash
opt-level = "s"

[profile.release]
debug = true    # Symbols are nice and they don't increase the size on Flash
opt-level = "s"

[dependencies]
defmt = { version = "1.1.0", optional = true }
esp-hal = { version = "1.2.0", default-features = false, features = [
    "requires-unstable",
] }
esp-sync = { git = "https://github.com/liebman/esp-hal.git", branch = "parl_io-interrupts" }
esp-metadata-generated = { version = "0.5.0" }
log = { version = "0.4.30", optional = true }
hub75-framebuffer = { version = "0.12.0" }

static_cell = { version = "2.1.1" }

[build-dependencies]
esp-metadata-generated = { version = "0.5.0", features = ["build-script"] }

[features]
default = []
skip-black-pixels = ["hub75-framebuffer/skip-black-pixels"]
iram = []
esp32 = [
    "esp-hal/esp32",
    "esp-sync/esp32",
    "esp-metadata-generated/esp32",
    "hub75-framebuffer/esp32-ordering",
]
esp32s3 = [
    "esp-hal/esp32s3",
    "esp-sync/esp32s3",
    "esp-metadata-generated/esp32s3",
]
esp32c5 = [
    "esp-hal/esp32c5",
    "esp-sync/esp32c5",
    "esp-metadata-generated/esp32c5",
]
esp32c6 = [
    "esp-hal/esp32c6",
    "esp-sync/esp32c6",
    "esp-metadata-generated/esp32c6",
]
defmt = [
    "dep:defmt",
    "esp-hal/defmt",
    "hub75-framebuffer/defmt",
]
log = ["dep:log", "esp-hal/log-04"]
# full BCM chain per DMA transfer (fewer ISRs, more RAM, C6 plane limit)
full-chain-dma = []
# circular descriptor chain, immediate pointer-swap in swap()
circular-dma = ["full-chain-dma"]
# these two invert the polarity of the blank and clock signals, respectively, in hardware.
invert-blank = []
invert-clock = []

invert-oe = ["hub75-framebuffer/invert-oe"]
tail-closes-latch = ["hub75-framebuffer/tail-closes-latch"]
lead-blank-1 = ["hub75-framebuffer/lead-blank-1"]
lead-blank-2 = ["hub75-framebuffer/lead-blank-2"]
lead-blank-4 = ["hub75-framebuffer/lead-blank-4"]
lead-blank-8 = ["hub75-framebuffer/lead-blank-8"]
lead-blank-16 = ["hub75-framebuffer/lead-blank-16"]
lead-blank-32 = ["hub75-framebuffer/lead-blank-32"]
trail-blank-1 = ["hub75-framebuffer/trail-blank-1"]
trail-blank-2 = ["hub75-framebuffer/trail-blank-2"]
trail-blank-4 = ["hub75-framebuffer/trail-blank-4"]
trail-blank-8 = ["hub75-framebuffer/trail-blank-8"]
trail-blank-16 = ["hub75-framebuffer/trail-blank-16"]
trail-blank-32 = ["hub75-framebuffer/trail-blank-32"]

inter-row-blank-4 = ["hub75-framebuffer/inter-row-blank-4"]
inter-row-blank-8 = ["hub75-framebuffer/inter-row-blank-8"]
inter-row-blank-16 = ["hub75-framebuffer/inter-row-blank-16"]
inter-row-blank-32 = ["hub75-framebuffer/inter-row-blank-32"]

reverse-row-order = ["hub75-framebuffer/reverse-row-order"]

# this feature is required for the docs.rs build and release builds to work
esp-hal-unstable = ["esp-hal/unstable"]

[package.metadata.docs.rs]
features = ["esp32c6", "esp-hal-unstable"]
targets = ["riscv32imac-unknown-none-elf"]
cargo-args = ["-Z", "build-std=core"]

# [patch."https://github.com/liebman/hub75-framebuffer.git"]
# hub75-framebuffer = { path = "../hub75-framebuffer" }

# [patch.crates-io]
# hub75-framebuffer = { path = "../hub75-framebuffer" }
# hub75-framebuffer = { git = "https://github.com/liebman/hub75-framebuffer.git", branch = "inter-row-blank" }

[patch.crates-io]
# esp-hal = { path = "../esp-hal/esp-hal" }
# esp-riscv-rt = { path = "../esp-hal/esp-riscv-rt" }
# xtensa-lx-rt = { path = "../esp-hal/xtensa-lx-rt" }
# esp-rom-sys = { path = "../esp-hal/esp-rom-sys" }

esp-hal = { git = "https://github.com/liebman/esp-hal.git", branch = "parl_io-interrupts" }
esp-riscv-rt = { git = "https://github.com/liebman/esp-hal.git", branch = "parl_io-interrupts" }
xtensa-lx-rt = { git = "https://github.com/liebman/esp-hal.git", branch = "parl_io-interrupts" }
esp-rom-sys = { git = "https://github.com/liebman/esp-hal.git", branch = "parl_io-interrupts" }
