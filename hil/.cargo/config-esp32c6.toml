[build]
target = "riscv32imac-unknown-none-elf"

[target.riscv32imac-unknown-none-elf]
runner = "probe-rs run --chip esp32c6"

rustflags = [
  "--cfg", "embedded_test",

  # On RISC-V the startup code stays in (`main` is what the generated entry
  # point calls), unlike the Xtensa configs which drop the startup files.
  "-C", "link-arg=-Tembedded-test.x",
  "-C", "link-arg=-Tdefmt.x",
  "-C", "link-arg=-Tlinkall.x",
  "-C", "force-frame-pointers",
]

[unstable]
build-std = ["alloc", "core"]
