[package]
name = "gradient-latched"
description = "Blocking (non-embassy) latched HUB75 demo for ESP32 / ESP32-S3 / ESP32-C6 / ESP32-C5"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
publish = false
license = "MIT OR Apache-2.0"

[profile.dev]
debug = true    # Symbols are nice and they don't increase the size on Flash
opt-level = "s"

[profile.release]
debug = true    # Symbols are nice and they don't increase the size on Flash
opt-level = "s"

[dependencies]
esp-hub75 = { path = "../..", default-features = false }

embedded-graphics = { version = "0.8.2" }
esp-backtrace = { version = "0.19.0", features = ["panic-handler"] }
esp-bootloader-esp-idf = "0.5.0"
esp-hal = { version = "1.1.0", features = ["unstable"] }
esp-println = { version = "0.17.0" }
heapless = { version = "0.9.3", features = ["ufmt"] }
static_cell = { version = "2.1.1" }

defmt = { version = "1.1.0", optional = true }
defmt-rtt = { version = "1.3.0", optional = true }
log = { version = "0.4.30", optional = true }

[features]
default = ["iram", "skip-black-pixels", "log"]

# ---- board selection (exactly one) ----
esp32 = [
    "esp-hub75/esp32",
    "esp-hal/esp32",
    "esp-backtrace/esp32",
    "esp-println/esp32",
    "esp-bootloader-esp-idf/esp32",
]
esp32s3 = [
    "esp-hub75/esp32s3",
    "esp-hal/esp32s3",
    "esp-backtrace/esp32s3",
    "esp-println/esp32s3",
    "esp-bootloader-esp-idf/esp32s3",
]
esp32c6 = [
    "esp-hub75/esp32c6",
    "esp-hal/esp32c6",
    "esp-backtrace/esp32c6",
    "esp-println/esp32c6",
    "esp-bootloader-esp-idf/esp32c6",
]
esp32c5 = [
    "esp-hub75/esp32c5",
    "esp-hal/esp32c5",
    "esp-backtrace/esp32c5",
    "esp-println/esp32c5",
    "esp-bootloader-esp-idf/esp32c5",
]

# ---- framebuffer layout ----
# Default is the 8-bit `latched` framebuffer; enable `row` to switch to the
# row-major `latched::row` layout instead.
row = []

# ---- hub75 clock speed ----
# 10 MHz by default; enable `20mhz` for faster panels. The ESP32's I2S
# peripheral caps out at 19 MHz, which `main.rs` handles automatically.
20mhz = []

# ---- logging ----
log = [
    "esp-hub75/log",
    "dep:log",
    "esp-backtrace/println",
    "esp-println/auto",
    "esp-println/log-04",
    "esp-println/colors",
]
defmt = [
    "esp-hub75/defmt",
    "dep:defmt",
    "dep:defmt-rtt",
    "esp-backtrace/defmt",
]

# ---- esp-hub75 feature pass-through ----
skip-black-pixels = ["esp-hub75/skip-black-pixels"]
iram = ["esp-hub75/iram"]
full-chain-dma = ["esp-hub75/full-chain-dma"]
circular-dma = ["esp-hub75/circular-dma"]
invert-blank = ["esp-hub75/invert-blank"]
invert-clock = ["esp-hub75/invert-clock"]
tail-closes-latch = ["esp-hub75/tail-closes-latch"]
lead-blank-1 = ["esp-hub75/lead-blank-1"]
lead-blank-2 = ["esp-hub75/lead-blank-2"]
lead-blank-4 = ["esp-hub75/lead-blank-4"]
lead-blank-8 = ["esp-hub75/lead-blank-8"]
lead-blank-16 = ["esp-hub75/lead-blank-16"]
lead-blank-32 = ["esp-hub75/lead-blank-32"]
trail-blank-1 = ["esp-hub75/trail-blank-1"]
trail-blank-2 = ["esp-hub75/trail-blank-2"]
trail-blank-4 = ["esp-hub75/trail-blank-4"]
trail-blank-8 = ["esp-hub75/trail-blank-8"]
trail-blank-16 = ["esp-hub75/trail-blank-16"]
trail-blank-32 = ["esp-hub75/trail-blank-32"]
inter-row-blank-4 = ["esp-hub75/inter-row-blank-4"]
inter-row-blank-8 = ["esp-hub75/inter-row-blank-8"]
inter-row-blank-16 = ["esp-hub75/inter-row-blank-16"]
inter-row-blank-32 = ["esp-hub75/inter-row-blank-32"]
reverse-row-order = ["esp-hub75/reverse-row-order"]
esp-hal-unstable = ["esp-hub75/esp-hal-unstable"]

